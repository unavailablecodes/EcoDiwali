  background: var(--tray); font-size: 12.5px; white-space: nowrap;

<script>
  // Staged boot watchdog: at 9 s the app may still be finishing, so show a calm
  // note; treat it as a real failure only at 30 s. The note dismisses itself
  // the moment boot succeeds, so it never lingers after a slow-but-fine load.
  window.__bootErrs = [];
  window.addEventListener('error', function (ev) {
    if (ev.target && ev.target.tagName === 'SCRIPT') window.__bootErrs.push('script: ' + (ev.target.src || 'inline'));
    window.__bootErrs.length = Math.min(window.__bootErrs.length, 6);
  }, true);
  setInterval(function () { if (window.__ready) document.getElementById('bootError').hidden = true; }, 400);
  setTimeout(function () {
    if (window.__ready) return;
    var el = document.getElementById('bootError');
    el.textContent = 'Still loading - your connection is slow. The app starts as soon as it finishes.';
    el.hidden = false;
    setTimeout(function () {
      if (window.__ready) return;
      el.textContent = 'This needs a connection the first time it loads. Check yours and reload.';
      try {
        var vid = null, mm = document.cookie.match(/(?:^|;\s*ecodiwali_vid=([^;]+)/);
        vid = (mm && mm[1]) || ((localStorage.getItem('ecodiwali.visitor') || '').split('|')[0] || null);
        fetch('/api/log', { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            e: 'd', s: vid || 'anon', stuck30: 1,
            errs: window.__bootErrs, onLine: navigator.onLine,
            gl: !!document.createElement('canvas').getContext('webgl2'),
            ua: navigator.userAgent.slice(0, 90)
          })
        });
      } catch (e) { /* diagnostics are best-effort */ }
    }, 21000);
  }, 9000);
</script>

/* ---------- Visitor log (host research) ----------

const LOG = (() => {

  const ua = navigator.userAgent;
  function browser() {
    if (/Edg\//.test(ua)) return 'Edge';
    if (/OPR\//.test(ua) || /Opera/.test(ua)) return 'Opera';
    if (/Samsung Internet/.test(ua)) return 'Samsung Internet';
    if (/Chrome\//.test(ua)) return 'Chrome';
    if (/Firefox\//.test(ua)) return 'Firefox';
    if (/CriOS/.test(ua)) return 'Safari (Chromium)';

  const btn = $('startBtn');
  btn.disabled = true; btn.textContent = 'Starting…';
  ensureAudio();
  let motion = 'granted';
  if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try { motion = await DeviceOrientationEvent.requestPermission(); } catch (e) { motion = 'denied'; }
  }
  LOG.st.motion = motion;
  const camP = startCamera();
  // Never gate the entry on the camera: phones can sit on the permission prompt for a
  // while, or warm up the sensor slowly. Enter within 6s no matter what; the live
  // feed attaches itself in the background the moment it is actually ready.
  try {
    await Promise.race([camP, new Promise(r => setTimeout(r, 6000))]);
    LOG.st.cam = camOn ? 'granted' : 'pending';
  } catch (e) { LOG.st.cam = camOn ? 'granted' : 'denied'; }
  camP.catch(() => { /* the background camera keeps trying; no unhandled rejection */ });
  if (!orient.ok) await new Promise((r) => setTimeout(r, 400));
  gyro = orient.ok && motion === 'granted';
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) { /* not granted */ }
  look.yaw = 0; look.pitch = .12;
  playing = true;
  distantT = 2;
  $('start').hidden = true;
  $('ui').hidden = false;
  renderPicker();
  applyMute();
  if (!camOn && !gyro) hint('No camera or motion here. Drag to look around, drag down for the ground, tap to burst.', 6000);
  else if (!gyro) hint('Motion is off. Drag to look around, tap to burst.', 5000);
  else if (!camOn) hint('Camera is off, so this is a painted night sky. Tap to burst.', 5000);
  else hint('Tap anywhere to burst it there. Tilt down for bombs and walas.', 4600);
});

/* ---------- Surface ring ---------- */
const ring = new THREE.Mesh(new THREE.RingGeometry(.3, .307, 72).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffae2b, transparent: true, opacity: 0, side: THREE.DoubleSide, depthTest: false, depthWrite: false, toneMapped: false }));
ring.frustumCulled = false; ring.renderOrder = 4;
scene.add(ring);
function updateRing(time) {
  const target = playing && mode === 'ground' && !uiHidden ? .6 : 0;
  ring.material.opacity += (target - ring.material.opacity) * .18;
  ring.visible = ring.material.opacity > .01;
  if (!ring.visible) return;
  ring.position.copy(floorPoint(fwd));
  ring.position.y = floorY + .005;
  ring.scale.setScalar(1 + Math.sin(time * 3.2) * .06);
}

/* ---------- Safety check: keep crackers away from what could catch fire ----------
   On-device object detection over the live camera (TensorFlow.js + COCO-SSD; the video
   never leaves the phone). When it spots something that should not be next to a cracker
   - a plant, a vehicle, an animal, a person - the banner asks to move to an open area.
   The banner intentionally stays up even when the controls are hidden for recording. */
const HAZARDS = { 'potted plant': 1, car: 1, truck: 1, bus: 1, motorcycle: 1, bicycle: 1, boat: 1, train: 1, bird: 1, cat: 1, dog: 1, horse: 1, sheep: 1, cow: 1, elephant: 1, bear: 1, zebra: 1, giraffe: 1, person: 1 };
const safeEl = $('safeWarn');
const det = { model: null, busy: false, clearStreak: 0, shown: false };
let safetyLibs = 'idle'; // idle -> loading -> loaded (idle again on failure, so a later tick retries)
function loadScriptOrFb(localSrc, cdnSrc) {
  return new Promise((resolve, reject) => {
    const attempt = (src, last) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = () => resolve();
      s.onerror = () => (last ? reject() : attempt(cdnSrc, true)); // self-hosted copy missing - use the public CDN
      document.head.appendChild(s);
    };
    attempt(localSrc, false);
  });
}
async function detLoad() {
  if (det.model) return;
  if (!window.cocoSsd || !window.tf) {
    // Fetch the safety-check libraries only once there is a live camera feed to
    // inspect - a painted-sky session never pays for them. The self-hosted copies
    // in /lib load from the same origin as the page; the public CDN is the fallback.
    if (camOn && safetyLibs === 'idle') {
      safetyLibs = 'loading';
      try {
        await loadScriptOrFb('./lib/tf.min.js', 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js');
        await loadScriptOrFb('./lib/coco-ssd.min.js', 'https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js');
        safetyLibs = 'loaded';
      } catch (e) { safetyLibs = 'idle'; } // retry on a later tick
    }
    return;
  }
  try { det.model = await window.cocoSsd.load({ baseNet: 'lite_mobilenet_v2' }); }
  catch (e) { /* the safety check just won't run */ }
}
function detShow(label) {
  safeEl.hidden = false;
  safeEl.innerHTML = '<strong>Something is nearby (' + label + ').</strong><br>Objects detected in front of you - please burn the crackers in an open area.';
  det.shown = true;
}
function detHide() { safeEl.hidden = true; det.shown = false; }
async function detScan() {
  if (det.shown && !camOn) detHide(); // painted night sky: nothing in front of the phone
  if (!det.model || det.busy || !camOn || document.hidden || video.readyState < 2) return;
  det.busy = true;
  let found = null;
  try {
    const preds = await det.model.detect(video, 200, .55);
    for (const p of preds) if (HAZARDS[p.class] && p.score >= .55) { found = p.class; break; }
  } catch (e) { /* frame not ready yet */ }
  det.busy = false;
  if (found) { det.clearStreak = 0; detShow(found); }
  else if (++det.clearStreak >= 2) detHide(); // two clean scans in a row before hiding
}
setInterval(() => { detLoad().then(detScan); }, 2200);

/* ---------- Loop ---------- */
let last = performance.now(), attractT = 1, distantT = 3, frameEma = 16, qualT = 3;
function attract(dt) {
  attractT -= dt;
  if (attractT > 0) return;
  attractT = rand(1.5, 2.6);
  const p = rayAt(rand(.25, .75) * W, rand(.1, .22) * H).multiplyScalar(rand(105, 130));
  pick([peony, chrysanthemum, goldenRain, crackling])(p, true);
}
function adaptQuality(rawDt, dt) {
  frameEma += (rawDt * 1000 - frameEma) * .05;
  qualT -= dt;
  if (qualT > 0 || quality <= .6 || !playing) return;
  qualT = 2;
  if (frameEma > 25) { quality = .6; resize(); }
}
function step(now) {
  const raw = Math.max(0, (now - last) / 1000), dt = Math.min(.05, raw);
  last = now;
  const time = now / 1000;
  if (!playing) { look.yaw = Math.sin(time * .1) * .04; look.pitch = .14; attract(dt); }
  updateCamera(dt);
  poolN = 0;
  if (playing) {
    holdRepeat(dt); autoDim(dt); adaptQuality(raw, dt);
    distantT -= dt;
    if (distantT <= 0) { distantT = rand(2.5, 8); sfx.distant(); }
  }
  for (let i = emitters.length - 1; i >= 0; i--) if (!emitters[i].update(dt)) emitters.splice(i, 1);
  for (let i = pulses.length - 1; i >= 0; i--) {
    const f = pulses[i];
    floorGlow(f.x, f.z, f.c, f.i, f.r);
    f.i -= f.i * f.d * dt + dt * .3;
    if (f.i <= .02) pulses.splice(i, 1);
  }
  for (let i = poolN; i < pools.length; i++) pools[i].visible = false;
  updateSparks(dt);
  updateSmoke(dt);
  updateRing(time);
  if (sceneLight > .002) {
    skyLight.visible = true;
    skyLight.material.uniforms.uC.value.setRGB(sceneLightC.x * sceneLight, sceneLightC.y * sceneLight, sceneLightC.z * sceneLight);
    sceneLight *= Math.exp(-dt * 7);
  } else skyLight.visible = false;
  if (shake > 0) {
    shake = Math.max(0, shake - dt * 2.4);
    sceneEl.style.transform = shake > 0 ? `translate(${rand(-9, 9) * shake}px, ${rand(-9, 9) * shake}px) scale(1.03)` : '';
  }
  renderer.render(scene, camera);
}
function frame(now) { requestAnimationFrame(frame); step(now); }

resize();
renderPicker();
if (!window.isSecureContext) { $('note').textContent = 'The camera and motion sensors only work from an https:// link. Here you get a painted night sky.'; $('note').hidden = false; }
if (location.hash === '#debug') window.__p = { tick(n = 1, ms = 16.7) { for (let i = 0; i < n; i++) step(last + ms); }, look, selected, fireAt, setMode, get alive() { return aliveCount; }, get mode() { return mode; }, emitters, get W() { return W; }, get H() { return H; }, get floorY() { return floorY; }, get quality() { return quality; }, setPlaying(v) { playing = v; }, setGyro(v) { gyro = v; primed = false; }, pools,
  fakeCam(paint) { const c = document.createElement('canvas'); c.width = 720; c.height = 1280; paint(c.getContext('2d'), 720, 1280); setInterval(() => paint(c.getContext('2d'), 720, 1280), 200); return attachFeed(c.captureStream(10)); } };
window.__ready = true;
requestAnimationFrame(frame);
</script>
</body>
